name: Testes Python
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Keep Tk's thread-affine garbage collection away from Qt workers.
      - name: Qt desktop (131 tests)
        run: python -m unittest discover -s tests -p "test_qt*.py" -v
      - name: Legacy regression (107 tests)
        run: python -m unittest discover -s tests -p "test_[!q]*.py" -v
